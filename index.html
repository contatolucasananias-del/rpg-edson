<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arcane VTT & RPG Manager</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    :root {
      --bg-darkest: #0a0b0e;
      --bg-dark: #12151c;
      --bg-panel: #1a1e29;
      --bg-card: #242a38;
      --accent-gold: #d4af37;
      --accent-gold-hover: #f1c40f;
      --accent-red: #e74c3c;
      --accent-blue: #3498db;
      --accent-green: #2ecc71;
      --text-main: #f0f4f8;
      --text-muted: #8c96a6;
      --border: #2d3548;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background-color: var(--bg-darkest); color: var(--text-main); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

    /* AUTH OVERLAY */
    #auth-screen {
      position: fixed; inset: 0; background: radial-gradient(circle at center, #1a1e29 0%, #0a0b0e 100%);
      z-index: 9999; display: flex; align-items: center; justify-content: center;
    }
    .auth-card {
      background: var(--bg-panel); border: 1px solid var(--accent-gold); padding: 30px;
      border-radius: 12px; width: 400px; box-shadow: 0 10px 40px rgba(0,0,0,0.8); text-align: center;
    }
    .auth-card h1 { color: var(--accent-gold); font-family: Georgia, serif; font-size: 1.8em; margin-bottom: 20px; }
    .form-group { margin-bottom: 15px; text-align: left; }
    .form-group label { display: block; font-size: 0.8em; color: var(--text-muted); margin-bottom: 5px; font-weight: bold; }
    .form-group input, .form-group select {
      width: 100%; padding: 10px; background: var(--bg-card); border: 1px solid var(--border);
      color: #fff; border-radius: 6px; font-size: 0.9em; outline: none;
    }
    .form-group input:focus { border-color: var(--accent-gold); }
    .btn-auth {
      width: 100%; padding: 12px; background: var(--accent-gold); border: none;
      color: #000; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.2s; margin-top: 10px; font-size: 1em;
    }
    .btn-auth:hover { background: var(--accent-gold-hover); }

    /* MAIN APP */
    #app-container { display: none; height: 100vh; flex-direction: column; }
    header {
      background: var(--bg-panel); border-bottom: 1px solid var(--border);
      padding: 0 16px; display: flex; justify-content: space-between; align-items: center; height: 50px; flex-shrink: 0;
    }
    .brand { font-weight: bold; color: var(--accent-gold); font-family: Georgia, serif; font-size: 1.1em; display: flex; align-items: center; gap: 8px; }
    .header-actions { display: flex; gap: 10px; align-items: center; }

    .btn {
      background: var(--bg-card); border: 1px solid var(--border); color: var(--text-main);
      padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 0.85em; transition: 0.2s; font-weight: 500;
    }
    .btn:hover { background: var(--border); color: #fff; }
    .btn-gold { background: var(--accent-gold); color: #000; border: none; font-weight: bold; }
    .btn-gold:hover { background: var(--accent-gold-hover); }

    /* SCENE TABS BAR */
    #scenes-bar {
      background: var(--bg-dark); border-bottom: 1px solid var(--border); padding: 4px 10px;
      display: flex; gap: 6px; align-items: center; overflow-x: auto; flex-shrink: 0; height: 40px;
    }
    .scene-tab {
      background: var(--bg-panel); border: 1px solid var(--border); padding: 4px 10px; border-radius: 4px;
      font-size: 0.8em; color: var(--text-muted); cursor: pointer; display: flex; align-items: center; gap: 6px; white-space: nowrap;
    }
    .scene-tab.active { background: var(--bg-card); border-color: var(--accent-gold); color: var(--accent-gold); font-weight: bold; }
    .scene-tab .visibility-btn { cursor: pointer; opacity: 0.6; }
    .scene-tab .visibility-btn.visible { opacity: 1; color: var(--accent-green); }

    /* MAIN CONTENT VIEW */
    main { display: flex; flex: 1; overflow: hidden; position: relative; }
    .tab-view { display: none; width: 100%; height: 100%; flex: 1; position: relative; }
    .tab-view.active { display: flex; }

    /* VTT CANVAS AREA */
    #vtt-viewport { flex: 1; position: relative; background: #050608; overflow: hidden; }
    #vtt-canvas { position: absolute; inset: 0; cursor: crosshair; }

    /* VTT TOOLBAR LEFT */
    .vtt-tools {
      position: absolute; top: 15px; left: 15px; background: var(--bg-panel); border: 1px solid var(--border);
      border-radius: 8px; padding: 8px; display: flex; flex-direction: column; gap: 8px; z-index: 10; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    .tool-btn {
      width: 36px; height: 36px; background: var(--bg-card); border: 1px solid var(--border); color: #fff;
      border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.1em;
    }
    .tool-btn.active, .tool-btn:hover { background: var(--accent-gold); color: #000; border-color: var(--accent-gold); }

    /* PALETTE DRAWER (OBJECTS / TOKENS) */
    #objects-palette {
      position: absolute; top: 15px; left: 70px; background: var(--bg-panel); border: 1px solid var(--border);
      border-radius: 8px; padding: 12px; width: 220px; z-index: 10; display: none; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    #objects-palette h4 { font-size: 0.85em; color: var(--accent-gold); margin-bottom: 10px; border-bottom: 1px solid var(--border); padding-bottom: 4px; }
    .palette-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .palette-item {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px; padding: 8px;
      text-align: center; cursor: pointer; font-size: 0.75em; transition: 0.2s;
    }
    .palette-item:hover { border-color: var(--accent-gold); transform: translateY(-2px); }
    .palette-item span { display: block; font-size: 1.4em; margin-bottom: 2px; }

    /* CHARACTER SHEET */
    .sheet-container { width: 100%; max-width: 1100px; margin: 20px auto; padding: 0 20px; overflow-y: auto; }
    .sheet-grid { display: grid; grid-template-columns: 280px 1fr; gap: 20px; }
    .sheet-card { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }

    .hp-bar-container { background: var(--bg-card); border-radius: 6px; padding: 10px; margin-top: 10px; text-align: center; }
    .hp-inputs { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 8px 0; }
    .hp-inputs input { width: 60px; text-align: center; background: var(--bg-panel); border: 1px solid var(--border); color: #fff; padding: 6px; border-radius: 4px; font-weight: bold; }

    .attr-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 15px; }
    .attr-card {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px; padding: 8px;
      text-align: center; cursor: pointer; transition: 0.2s;
    }
    .attr-card:hover { border-color: var(--accent-gold); }
    .attr-title { font-size: 0.7em; color: var(--text-muted); text-transform: uppercase; font-weight: bold; }
    .attr-value { font-size: 1.5em; font-weight: bold; color: var(--accent-gold); }
    .attr-mod { font-size: 0.8em; color: #fff; background: var(--bg-panel); border-radius: 10px; padding: 2px 6px; display: inline-block; margin-top: 2px; }

    /* RIGHT SIDEBAR (CHAT & AUDIO) */
    #sidebar-right { width: 340px; background: var(--bg-panel); border-left: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
    .chat-box { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    .chat-msg { background: var(--bg-card); padding: 8px 12px; border-radius: 6px; font-size: 0.85em; border-left: 3px solid var(--accent-blue); }
    .chat-msg.roll { border-left-color: var(--accent-gold); background: #262115; }
    .chat-msg.secret { border-left-color: var(--accent-red); background: #281618; }
    .chat-msg .author { font-weight: bold; color: var(--accent-gold); margin-bottom: 2px; }

    .dice-bar { padding: 10px; border-top: 1px solid var(--border); display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; background: var(--bg-dark); }
    
    .audio-player { padding: 12px; border-top: 1px solid var(--border); background: var(--bg-card); display: flex; flex-direction: column; gap: 8px; }
    .audio-player input[type="text"] { background: var(--bg-panel); border: 1px solid var(--border); color: #fff; padding: 6px; border-radius: 4px; font-size: 0.8em; }

    .flex-row { display: flex; gap: 8px; align-items: center; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- AUTH / LOGIN -->
  <div id="auth-screen">
    <div class="auth-card">
      <h1>Arcane VTT</h1>
      <div class="form-group">
        <label>Seu Nome / Apelido</label>
        <input type="text" id="auth-name" placeholder="Ex: Lucas">
      </div>
      <div class="form-group">
        <label>Papel na Mesa</label>
        <select id="auth-role">
          <option value="player">Jogador</option>
          <option value="dm">Mestre (DM)</option>
        </select>
      </div>
      <div class="form-group" id="char-name-group">
        <label>Nome do Personagem</label>
        <input type="text" id="auth-char" placeholder="Ex: Eldrin, o Mago">
      </div>
      <button class="btn-auth" onclick="login()">Entrar na Partida</button>
    </div>
  </div>

  <!-- MAIN APP -->
  <div id="app-container">
    <header>
      <div class="brand">⚔️ Arcane VTT Nexus</div>
      
      <div class="header-actions">
        <div id="dm-header-actions" class="flex-row hidden">
          <button class="btn btn-gold" onclick="createRoom()">🔑 Criar Sala</button>
          <button class="btn" onclick="copyRoomCode()">📋 Copiar Código</button>
          <span id="room-code-tag" style="font-size:0.85em; color:var(--accent-gold); font-weight:bold;"></span>
        </div>

        <div id="player-header-actions" class="flex-row hidden">
          <input type="text" id="join-code-input" placeholder="Código da Sala" style="width:110px; padding:4px; background:var(--bg-card); border:1px solid var(--border); color:#fff; border-radius:4px;">
          <button class="btn btn-gold" onclick="joinRoom()">Conectar</button>
        </div>

        <button class="btn" onclick="switchMainTab('vtt')">🗺️ Tabuleiro</button>
        <button class="btn" onclick="switchMainTab('sheet')">📜 Ficha</button>
        <span id="user-display-tag" style="font-size:0.8em; background:var(--bg-card); padding:4px 8px; border-radius:12px; border:1px solid var(--border);"></span>
      </div>
    </header>

    <!-- BARRA DE ABAS DE CENÁRIOS (MULTI-SCENES) -->
    <div id="scenes-bar">
      <span style="font-size:0.75em; color:var(--text-muted); font-weight:bold; margin-right:4px;">CENÁRIOS:</span>
      <div id="scenes-tabs-list" class="flex-row"></div>
      <button id="add-scene-btn" class="btn hidden" style="padding:2px 8px; font-size:0.8em;" onclick="addNewScene()">+ Novo Cenário</button>
    </div>

    <main>
      <!-- VIEW 1: TABULEIRO VTT -->
      <div id="view-vtt" class="tab-view active">
        <div id="vtt-viewport">
          <!-- PAINEL DE FERRAMENTAS ESQUERDO -->
          <div class="vtt-tools">
            <button class="tool-btn active" id="tool-select" title="Mover Tokens" onclick="setTool('select')">✋</button>
            <button class="tool-btn hidden" id="tool-objects" title="Adicionar Objetos/NPCs" onclick="togglePalette()">📦</button>
            <button class="tool-btn hidden" id="tool-fog" title="Névoa de Guerra" onclick="setTool('fog')">🌫️</button>
            <button class="tool-btn hidden" id="tool-bg" title="Mudar Imagem de Fundo" onclick="changeBackground()">🖼️</button>
          </div>

          <!-- PALETA DE OBJETOS DO MESTRE -->
          <div id="objects-palette">
            <h4>Adicionar na Mesa</h4>
            <div class="palette-grid">
              <div class="palette-item" onclick="spawnObject('monster', '👹 Inimigo')"><span>👹</span>Inimigo</div>
              <div class="palette-item" onclick="spawnObject('npc', '🧙‍♂️ NPC')"><span>🧙‍♂️</span>NPC</div>
              <div class="palette-item" onclick="spawnObject('chest', '📦 Baú')"><span>📦</span>Baú</div>
              <div class="palette-item" onclick="spawnObject('door', '🚪 Porta')"><span>🚪</span>Porta</div>
              <div class="palette-item" onclick="spawnObject('trap', '⚠️ Armadilha')"><span>⚠️</span>Armadilha</div>
              <div class="palette-item" onclick="spawnObject('fire', '🔥 Fogueira')"><span>🔥</span>Fogueira</div>
            </div>
          </div>

          <canvas id="vtt-canvas"></canvas>
        </div>
      </div>

      <!-- VIEW 2: FICHA DO PERSONAGEM -->
      <div id="view-sheet" class="tab-view">
        <div class="sheet-container">
          <div class="sheet-grid">
            <div class="sheet-card">
              <h2 id="sheet-char-name" style="color:var(--accent-gold);">Personagem</h2>
              <div class="hp-bar-container">
                <span style="font-size:0.75em; color:var(--text-muted); font-weight:bold;">PONTOS DE VIDA (HP)</span>
                <div class="hp-inputs">
                  <input type="number" id="hp-curr" value="25" onchange="updateHP()">
                  <span>/</span>
                  <input type="number" id="hp-max" value="30" onchange="updateHP()">
                </div>
                <div class="flex-row" style="justify-content:center;">
                  <button class="btn" style="color:var(--accent-red)" onclick="modHP(-5)">-5</button>
                  <button class="btn" style="color:var(--accent-red)" onclick="modHP(-1)">-1</button>
                  <button class="btn" style="color:var(--accent-green)" onclick="modHP(1)">+1</button>
                  <button class="btn" style="color:var(--accent-green)" onclick="modHP(5)">+5</button>
                </div>
              </div>

              <!-- Atributos -->
              <div class="attr-grid">
                <div class="attr-card" onclick="rollCheck('Força', 16)"><div class="attr-title">FOR</div><div class="attr-value">16</div><div class="attr-mod">+3</div></div>
                <div class="attr-card" onclick="rollCheck('Destreza', 14)"><div class="attr-title">DES</div><div class="attr-value">14</div><div class="attr-mod">+2</div></div>
                <div class="attr-card" onclick="rollCheck('Constituição', 15)"><div class="attr-title">CON</div><div class="attr-value">15</div><div class="attr-mod">+2</div></div>
                <div class="attr-card" onclick="rollCheck('Inteligência', 10)"><div class="attr-title">INT</div><div class="attr-value">10</div><div class="attr-mod">+0</div></div>
                <div class="attr-card" onclick="rollCheck('Sabedoria', 12)"><div class="attr-title">SAB</div><div class="attr-value">12</div><div class="attr-mod">+1</div></div>
                <div class="attr-card" onclick="rollCheck('Carisma', 8)"><div class="attr-title">CAR</div><div class="attr-value">8</div><div class="attr-mod">-1</div></div>
              </div>
            </div>

            <div class="sheet-card">
              <h3 style="color:var(--accent-gold); margin-bottom:12px;">Ataques & Ações</h3>
              <div style="display:flex; flex-direction:column; gap:8px;">
                <div style="background:var(--bg-card); padding:10px; border-radius:6px; display:flex; justify-content:space-between; align-items:center;">
                  <div>
                    <strong>Espada Longa</strong>
                    <div style="font-size:0.75em; color:var(--text-muted)">1d8 + 3 Perfurante</div>
                  </div>
                  <button class="btn btn-gold" onclick="rollAttack('Espada Longa', 5, '1d8+3')">Atacar (d20+5)</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- PAINEL LATERAL DIREITO -->
      <div id="sidebar-right">
        <div style="padding:10px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center;">
          <span style="font-size:0.8em; font-weight:bold; color:var(--text-muted)">LOG DE COMBATE</span>
          <label style="font-size:0.7em;" id="dm-secret-option" class="hidden">
            <input type="checkbox" id="secret-roll-flag"> Secreto
          </label>
        </div>

        <div id="chat-messages" class="chat-box"></div>

        <div class="dice-bar">
          <button class="btn" onclick="quickRoll(4)">d4</button>
          <button class="btn" onclick="quickRoll(6)">d6</button>
          <button class="btn" onclick="quickRoll(8)">d8</button>
          <button class="btn" onclick="quickRoll(10)">d10</button>
          <button class="btn" onclick="quickRoll(12)">d12</button>
          <button class="btn" onclick="quickRoll(20)">d20</button>
          <button class="btn" onclick="quickRoll(100)">d100</button>
        </div>

        <div class="audio-player">
          <span style="font-size:0.7em; color:var(--text-muted); font-weight:bold;">🎵 TRILHA AMBIENTE (YOUTUBE)</span>
          <div class="flex-row">
            <input type="text" id="yt-url-input" placeholder="Link do YouTube">
            <button class="btn btn-gold" onclick="playMusic()">▶</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    // ESTADO GLOBAL DA APLICAÇÃO
    let user = { name: '', role: 'player', charName: '' };
    let peer = null, roomCode = '', connections = [];
    let currentTool = 'select';

    // ESTRUTURA DE CENÁRIOS MULTI-ABAS
    let scenes = [
      { id: 'sc_1', name: 'Masmorra Principal', bg: '', visibleToPlayers: true, tokens: [], fog: [] }
    ];
    let activeSceneId = 'sc_1';

    let selectedToken = null, isDragging = false, dragOffset = { x: 0, y: 0 };

    function login() {
      const name = document.getElementById('auth-name').value.trim();
      const role = document.getElementById('auth-role').value;
      const charName = document.getElementById('auth-char').value.trim();

      if (!name) return alert('Insira seu nome!');

      user = { name, role, charName: charName || name };
      document.getElementById('auth-screen').classList.add('hidden');
      document.getElementById('app-container').style.display = 'flex';
      document.getElementById('user-display-tag').innerText = `${user.name} (${user.role === 'dm' ? 'DM' : 'Player'})`;
      document.getElementById('sheet-char-name').innerText = user.charName;

      if (user.role === 'dm') {
        document.getElementById('dm-header-actions').classList.remove('hidden');
        document.getElementById('dm-secret-option').classList.remove('hidden');
        document.getElementById('add-scene-btn').classList.remove('hidden');
        document.getElementById('tool-objects').classList.remove('hidden');
        document.getElementById('tool-fog').classList.remove('hidden');
        document.getElementById('tool-bg').classList.remove('hidden');
      } else {
        document.getElementById('player-header-actions').classList.remove('hidden');
      }

      renderSceneTabs();
      initCanvas();
    }

    // CONEXÃO PEERJS / REDE
    function createRoom() {
      roomCode = 'ARCANE-' + Math.floor(1000 + Math.random() * 9000);
      peer = new Peer(roomCode);
      peer.on('open', id => {
        document.getElementById('room-code-tag').innerText = id;
        addLog(`Sala criada! Código: <strong>${id}</strong>`, 'msg');
      });
      peer.on('connection', conn => {
        connections.push(conn);
        conn.on('data', data => handleNetData(data));
        
        // Quando player entra, cria o token dele na mesa ativa
        conn.on('open', () => {
          syncStateToPlayers();
        });
      });
    }

    function joinRoom() {
      const code = document.getElementById('join-code-input').value.trim();
      if (!code) return alert('Insira o código!');

      peer = new Peer();
      peer.on('open', () => {
        const conn = peer.connect(code);
        connections.push(conn);
        conn.on('open', () => {
          addLog(`Conectado à sala!`, 'msg');
          // Envia aviso ao mestre para registrar token
          conn.send({ type: 'player_join', charName: user.charName });
        });
        conn.on('data', data => handleNetData(data));
      });
    }

    function copyRoomCode() {
      navigator.clipboard.writeText(roomCode);
      alert(`Código ${roomCode} copiado!`);
    }

    function broadcast(data) {
      connections.forEach(c => c.send(data));
    }

    function syncStateToPlayers() {
      if (user.role !== 'dm') return;
      broadcast({ type: 'sync_state', scenes, activeSceneId });
    }

    function handleNetData(data) {
      if (data.type === 'sync_state') {
        // Player recebe lista de cenários filtrados
        scenes = data.scenes;
        activeSceneId = data.activeSceneId;
        renderSceneTabs();
        drawCanvas();
      } else if (data.type === 'player_join' && user.role === 'dm') {
        // Mestre cria token para o jogador que entrou
        const curScene = scenes.find(s => s.id === activeSceneId);
        if (curScene && !curScene.tokens.some(t => t.label === data.charName)) {
          curScene.tokens.push({ id: 'tok_' + Date.now(), label: data.charName, x: 100, y: 100, color: '#3498db', icon: '🤺', hp: 30, maxHp: 30 });
          syncStateToPlayers();
          drawCanvas();
        }
      } else if (data.type === 'log') {
        addLog(data.text, data.msgType, data.author);
      }
    }

    // GESTÃO DE SCENARIOS (ABAS)
    function renderSceneTabs() {
      const container = document.getElementById('scenes-tabs-list');
      container.innerHTML = '';

      scenes.forEach(sc => {
        if (user.role !== 'dm' && !sc.visibleToPlayers) return; // Oculta aba se player não tiver permissão

        const tab = document.createElement('div');
        tab.className = `scene-tab ${sc.id === activeSceneId ? 'active' : ''}`;
        
        let visBtn = user.role === 'dm' ? `<span class="visibility-btn ${sc.visibleToPlayers ? 'visible' : ''}" onclick="toggleSceneVisibility(event, '${sc.id}')">👁️</span>` : '';
        tab.innerHTML = `${visBtn} <span>${sc.name}</span>`;
        tab.onclick = () => selectScene(sc.id);
        container.appendChild(tab);
      });
    }

    function selectScene(id) {
      activeSceneId = id;
      renderSceneTabs();
      drawCanvas();
      if (user.role === 'dm') syncStateToPlayers();
    }

    function addNewScene() {
      const name = prompt('Nome do novo cenário:', 'Nova Masmorra');
      if (!name) return;
      const newSc = { id: 'sc_' + Date.now(), name, bg: '', visibleToPlayers: false, tokens: [], fog: [] };
      scenes.push(newSc);
      selectScene(newSc.id);
    }

    function toggleSceneVisibility(e, id) {
      e.stopPropagation();
      const sc = scenes.find(s => s.id === id);
      if (sc) {
        sc.visibleToPlayers = !sc.visibleToPlayers;
        renderSceneTabs();
        syncStateToPlayers();
      }
    }

    // CANVAS & DESENHO DE OBJETOS
    let canvas, ctx;
    function initCanvas() {
      canvas = document.getElementById('vtt-canvas');
      ctx = canvas.getContext('2d');
      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);

      canvas.addEventListener('mousedown', onMouseDown);
      canvas.addEventListener('mousemove', onMouseMove);
      canvas.addEventListener('mouseup', onMouseUp);

      drawCanvas();
    }

    function resizeCanvas() {
      canvas.width = document.getElementById('vtt-viewport').clientWidth;
      canvas.height = document.getElementById('vtt-viewport').clientHeight;
      drawCanvas();
    }

    function drawCanvas() {
      if (!ctx) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Fundo Escuro Grid
      ctx.fillStyle = '#0a0b0e';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Desenha Linhas do Grid
      ctx.strokeStyle = '#181d28';
      ctx.lineWidth = 1;
      const gridSize = 40;
      for (let x = 0; x < canvas.width; x += gridSize) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
      }
      for (let y = 0; y < canvas.height; y += gridSize) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
      }

      const curScene = scenes.find(s => s.id === activeSceneId);
      if (!curScene) return;

      // Desenha Tokens e Objetos
      curScene.tokens.forEach(tok => {
        ctx.beginPath();
        ctx.arc(tok.x, tok.y, 18, 0, Math.PI * 2);
        ctx.fillStyle = tok.color || '#d4af37';
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.font = '16px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(tok.icon || '♟️', tok.x, tok.y);

        // Rótulo/Nome
        ctx.font = '10px sans-serif';
        ctx.fillStyle = '#fff';
        ctx.fillText(tok.label, tok.x, tok.y + 28);
      });
    }

    function onMouseDown(e) {
      const rect = canvas.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;

      const curScene = scenes.find(s => s.id === activeSceneId);
      if (!curScene) return;

      // Procura Token clicado
      selectedToken = curScene.tokens.find(t => Math.hypot(t.x - mouseX, t.y - mouseY) < 20);
      if (selectedToken) {
        isDragging = true;
        dragOffset = { x: mouseX - selectedToken.x, y: mouseY - selectedToken.y };
      }
    }

    function onMouseMove(e) {
      if (isDragging && selectedToken) {
        const rect = canvas.getBoundingClientRect();
        selectedToken.x = e.clientX - rect.left - dragOffset.x;
        selectedToken.y = e.clientY - rect.top - dragOffset.y;
        drawCanvas();
        if (user.role === 'dm') syncStateToPlayers();
      }
    }

    function onMouseUp() {
      isDragging = false;
      selectedToken = null;
    }

    function togglePalette() {
      const p = document.getElementById('objects-palette');
      p.style.display = p.style.display === 'block' ? 'none' : 'block';
    }

    function spawnObject(type, label) {
      const curScene = scenes.find(s => s.id === activeSceneId);
      if (!curScene) return;

      const icons = { monster: '👹', npc: '🧙‍♂️', chest: '📦', door: '🚪', trap: '⚠️', fire: '🔥' };
      curScene.tokens.push({
        id: 'obj_' + Date.now(), label, x: 200, y: 200, color: '#e74c3c', icon: icons[type] || '📦'
      });
      drawCanvas();
      syncStateToPlayers();
      togglePalette();
    }

    function setTool(tool) {
      currentTool = tool;
      document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(`tool-${tool}`)?.classList.add('active');
    }

    // ROLAGEM DE DADOS E LOGS
    function addLog(text, msgType = 'msg', author = '') {
      const chat = document.getElementById('chat-messages');
      const el = document.createElement('div');
      el.className = `chat-msg ${msgType}`;
      el.innerHTML = author ? `<div class="author">${author}</div>${text}` : text;
      chat.appendChild(el);
      chat.scrollTop = chat.scrollHeight;
    }

    function quickRoll(sides) {
      const res = Math.floor(Math.random() * sides) + 1;
      const isSecret = document.getElementById('secret-roll-flag')?.checked;
      const text = `Rolou 1d${sides} ➔ <strong>[${res}]</strong>`;

      if (isSecret && user.role === 'dm') {
        addLog(text + ' (Secreto)', 'secret', user.name);
      } else {
        addLog(text, 'roll', user.name);
        broadcast({ type: 'log', text, msgType: 'roll', author: user.name });
      }
    }

    function rollCheck(name, score) {
      const mod = Math.floor((score - 10) / 2);
      const roll = Math.floor(Math.random() * 20) + 1;
      const text = `Teste de <strong>${name}</strong>: d20(${roll}) + ${mod} ➔ <strong>[${roll + mod}]</strong>`;
      addLog(text, 'roll', user.charName);
      broadcast({ type: 'log', text, msgType: 'roll', author: user.charName });
    }

    function rollAttack(weapon, mod, dmg) {
      const roll = Math.floor(Math.random() * 20) + 1;
      const text = `Ataque <strong>${weapon}</strong>: d20(${roll}) + ${mod} ➔ <strong>[${roll + mod}] para acertar</strong> | Dano: [${dmg}]`;
      addLog(text, 'roll', user.charName);
      broadcast({ type: 'log', text, msgType: 'roll', author: user.charName });
    }

    // FICHA E HP
    function modHP(val) {
      const input = document.getElementById('hp-curr');
      input.value = parseInt(input.value || 0) + val;
    }

    function switchMainTab(tab) {
      document.querySelectorAll('.tab-view').forEach(v => v.classList.remove('active'));
      document.getElementById(`view-${tab}`).classList.add('active');
      if (tab === 'vtt') resizeCanvas();
    }
  </script>
</body>
</html>
